name: Release RCAMP CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p rcamp-cli --release
      - run: tar -C target/release -czf rcamp-linux-x86_64.tar.gz rcamp
      - uses: actions/upload-artifact@v4
        with: { name: cli-linux, path: rcamp-linux-x86_64.tar.gz }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p rcamp-cli --release
      - shell: pwsh
        run: Compress-Archive -Path target/release/rcamp.exe -DestinationPath rcamp-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with: { name: cli-windows, path: rcamp-windows-x86_64.zip }

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
