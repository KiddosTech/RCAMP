name: Build RCAMP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux GUI and CLI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Linux bundle dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check
      - name: Format Rust source
        run: cargo fmt --all
      - run: cargo test -p rcamp-core -p rcamp-cli
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build AppImage
        run: npx tauri build --bundles appimage
      - name: Verify AppImage
        run: |
          find target/release/bundle/appimage -name '*.AppImage' -type f -size +1M -print -quit | grep .
      - uses: actions/upload-artifact@v4
        with: { name: RCAMP-linux-appimage, path: target/release/bundle/appimage/*.AppImage, if-no-files-found: error }
      - name: Package CLI
        run: tar -C target/release -czf rcamp-linux-x86_64.tar.gz rcamp
      - uses: actions/upload-artifact@v4
        with: { name: RCAMP-cli-linux, path: rcamp-linux-x86_64.tar.gz }

  android:
    name: Android APK and AAB
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK packages and Rust target
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - name: Initialize Android project
        run: npx tauri android init --ci
      - name: Keep Tauri Android Gradle DSL compatible
        run: |
          if ! grep -qxF 'android.newDsl=false' src-tauri/gen/android/gradle.properties; then
            printf '\nandroid.newDsl=false\n' >> src-tauri/gen/android/gradle.properties
          fi
      - name: Configure Android release signing
        if: env.ANDROID_KEY_BASE64 != ''
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_BASE64" || { echo 'ANDROID_KEY_BASE64 is required for tagged Android releases'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required for tagged Android releases'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required for tagged Android releases'; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo 'ANDROID_STORE_PASSWORD is required for tagged Android releases'; exit 1; }
          cd src-tauri/gen/android
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > keystore.properties
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/rcamp-upload.jks"
          printf 'storeFile=%s\n' "$RUNNER_TEMP/rcamp-upload.jks" >> keystore.properties
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          lines = [line for line in text.splitlines() if line.strip() not in {'import java.io.FileInputStream', 'import java.util.Properties'}]
          text = 'import java.io.FileInputStream\nimport java.util.Properties\n\n' + '\n'.join(lines) + '\n'
          signing = '''
              signingConfigs {
                  create("release") {
                      val propertiesFile = rootProject.file("keystore.properties")
                      val properties = Properties()
                      properties.load(FileInputStream(propertiesFile))
                      keyAlias = properties["keyAlias"] as String
                      keyPassword = properties["keyPassword"] as String
                      storeFile = file(properties["storeFile"] as String)
                      storePassword = properties["storePassword"] as String
                  }
              }
          '''
          if 'create("release")' not in text:
              text = text.replace('    buildTypes {', signing + '\n    buildTypes {', 1)
          release = 'getByName("release") {'
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              text = text.replace(release, release + '\n            signingConfig = signingConfigs.getByName("release")', 1)
          path.write_text(text)
          PY
      - name: Require signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEY_BASE64 == ''
        run: |
          echo 'Android signing secrets are required for tagged releases.'
          exit 1
      - name: Build universal APK
        run: npx tauri android build --apk --target aarch64
      - name: Verify APK exists and is plausible
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f -size +1M -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name="
      - name: Verify APK signing for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f -size +1M -print -quit)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
      - uses: actions/upload-artifact@v4
        with: { name: RCAMP-android-apk, path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk, if-no-files-found: error }
      - name: Build Android App Bundle
        run: npx tauri android build --aab --target aarch64
      - uses: actions/upload-artifact@v4
        with: { name: RCAMP-android-aab, path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab, if-no-files-found: error }

  windows:
    name: Windows GUI and CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: npm ci
      - run: npm run check
      - name: Format Rust source
        run: cargo fmt --all
      - run: cargo test -p rcamp-core -p rcamp-cli
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build MSI
        run: npx tauri build --bundles msi
      - name: Verify MSI
        shell: pwsh
        run: if (-not (Get-ChildItem target/release/bundle/msi -Recurse -Filter *.msi | Where-Object Length -gt 1MB | Select-Object -First 1)) { throw 'MSI was not produced' }
      - uses: actions/upload-artifact@v4
        with: { name: RCAMP-windows-msi, path: target/release/bundle/msi/**/*.msi, if-no-files-found: error }
      - name: Package CLI
        shell: pwsh
        run: Compress-Archive -Path target/release/rcamp.exe -DestinationPath rcamp-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with: { name: RCAMP-cli-windows, path: rcamp-windows-x86_64.zip }
