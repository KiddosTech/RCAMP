[package]
name = "rcamp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RCAMP/CLI local device manager"

[[bin]]
name = "rcamp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
rcamp-core = { path = "../rcamp-core" }
